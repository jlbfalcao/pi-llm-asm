name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-aarch64-linux-gnu qemu-system-arm zip

      - name: Build kernel8.img
        run: make

      - name: Smoke test in QEMU (Pi 3B)
        run: |
          set +e
          timeout 60 qemu-system-aarch64 -M raspi3b -kernel build/kernel8.img \
            -serial stdio -display none < /dev/null > qemu.log 2>&1
          set -e
          cat qemu.log
          grep -q "model: dim=" qemu.log
          grep -q "pi-llm>" qemu.log

      - name: Build SD card bundle
        run: make sdcard

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-llm-${{ github.ref_name }}
          path: |
            build/kernel8.img
            build/pi-llm-sdcard.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/kernel8.img build/pi-llm-sdcard.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
